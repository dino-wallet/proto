syntax = "proto3";
package dinoinsure.notification.v1;
option java_package = "ma.dinoinsure.notification.v1";
option java_multiple_files = true;

message PushEventGrpc {
  string user_id = 1;
  string title = 2;
  string body = 3;
  map<string, string> data = 4;
}

message OtpEventGrpc {
  string phone = 1;
  string otp_code = 2;
  string expires_at = 3;
}

message EmailEventGrpc {
  string to = 1;
  string subject = 2;
  string template = 3;
  map<string, string> vars = 4;
}

message SmsEventGrpc {
  string phone = 1;
  string message = 2;
}
